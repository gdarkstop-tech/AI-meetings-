name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector is a hard requirement (see docs/PHASE-0-AUDIT.md §2.3).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alia_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alia_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply migrations (fails if required extensions are missing)
        run: npm run db:migrate
      - name: Verify (typecheck + architecture boundaries + tests)
        run: npm run verify
      - name: Build web client
        run: npm run build:web
      - name: Audit dependencies
        run: npm audit --audit-level=high
