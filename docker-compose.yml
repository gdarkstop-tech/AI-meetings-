# Self-hosted deployment: database, API (serving the built client) and worker.
#
# Storage: S3-compatible object storage (AWS S3, Cloudflare R2, MinIO, Wasabi).
# The containers run as an unprivileged user and mount no writable data volume,
# so there is no volume-ownership problem to work around. Local filesystem
# storage stays available for development and tests outside containers
# (STORAGE_PROVIDER=local with npm run dev:api / dev:worker).
#
# Copy .env.example to .env and fill it in before `docker compose up -d`.
# Compose refuses to start if a required storage variable is missing rather
# than booting containers that would fail on the first upload.
services:
  db:
    # pgvector is required (docs/PHASE-0-AUDIT.md §2.3).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alia}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-alia}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alia}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    command: npm run start:api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alia}
      NODE_ENV: production
      PORT: 4000
      STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      # Leave unset for AWS S3; set it for R2, MinIO or another S3-compatible endpoint.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4000/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The worker is a separate always-on process. Without it nothing is
  # transcribed, analysed, purged or executed — the queue just grows.
  # It writes only to /tmp while transcoding, which the image already allows
  # for the unprivileged user; give the host enough free disk for the largest
  # meeting you expect to process.
  worker:
    build: .
    command: npm run start:worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alia}
      NODE_ENV: production
      STORAGE_PROVIDER: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
